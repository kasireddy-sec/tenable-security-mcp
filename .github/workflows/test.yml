name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r <(python -c "import tomllib; print('\\n'.join(tomllib.load(open('extension/pyproject.toml','rb'))['project']['dependencies']))")

      - name: Validate Python files
        run: |
          python -m py_compile extension/server.py
          python -m py_compile src/server.py
